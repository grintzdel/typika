services:
  caddy:
    image: caddy:2@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    restart: unless-stopped
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      TYPIKA_APP_DOMAIN: ${TYPIKA_APP_DOMAIN:?set TYPIKA_APP_DOMAIN in .env}
      TYPIKA_RUNTIME_DOMAIN: ${TYPIKA_RUNTIME_DOMAIN:?set TYPIKA_RUNTIME_DOMAIN in .env}
    depends_on:
      web:
        condition: service_healthy

  web:
    build: .
    image: typika-web
    restart: unless-stopped
    env_file: .env
    environment:
      TYPIKA_TRUST_PROXY: 'true'
    expose: ['3000']
    networks: [default, kotlin]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  kotlin-compiler:
    profiles: [kotlin]
    build: services/kotlin-compiler
    image: typika-kotlin-compiler
    restart: unless-stopped
    environment:
      KOTLIN_COMPILER_CONCURRENCY: ${KOTLIN_COMPILER_CONCURRENCY:-2}
      KOTLIN_COMPILER_QUEUE_MAX: ${KOTLIN_COMPILER_QUEUE_MAX:-20}
      KOTLIN_COMPILER_TIMEOUT_MS: ${KOTLIN_COMPILER_TIMEOUT_MS:-15000}
      KOTLIN_COMPILER_CACHE_MB: ${KOTLIN_COMPILER_CACHE_MB:-32}
    expose: ['8080']
    networks: [kotlin]
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: ${KOTLIN_COMPILER_MEMORY:-1g}
    memswap_limit: ${KOTLIN_COMPILER_MEMORY:-1g}
    cpus: ${KOTLIN_COMPILER_CPUS:-2}
    pids_limit: 256

networks:
  default: {}
  kotlin:
    internal: true

volumes:
  caddy_data: {}
  caddy_config: {}
