name: images

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - { name: typika-web, context: . }
          - { name: typika-kotlin-compiler, context: services/kotlin-compiler }
        platform:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    env:
      IMAGE: ghcr.io/typika-app/${{ matrix.image.name }}:${{ github.sha }}-${{ matrix.platform.arch }}
      CONTEXT: ${{ matrix.image.context }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          docker buildx build --provenance=false --push --tag "$IMAGE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" "$CONTEXT"

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      packages: write
    strategy:
      matrix:
        name: [typika-web, typika-kotlin-compiler]
    env:
      IMAGE: ghcr.io/typika-app/${{ matrix.name }}
    steps:
      - run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          docker buildx imagetools create --tag "$IMAGE:latest" --tag "$IMAGE:$GITHUB_SHA" \
            "$IMAGE:$GITHUB_SHA-amd64" "$IMAGE:$GITHUB_SHA-arm64"
