schema = 1
name = "decorator-js"
title = "Decorator: sending notifications"
summary = "Add behaviour to a function by wrapping it in another function with the same signature."
license = "MIT-0"
authors = ["github:maoudin"]

[facets]
language = "javascript"
paradigm = ["oop"]
topic = ["design-pattern/structural/decorator", "principle/open-closed"]
level = "intermediate"
useCase = ["backend"]

[runtime]
kind = "browser-js"
entry = "src/main.js"

[commands]
test = "vitest"

[tests]
include = ["tests/**/*.test.js"]

[tour]
steps = [
  "tour/01-overview.md",
  "tour/02-flag-soup.md",
  "tour/03-same-interface.md",
  "tour/04-wrapping.md",
  "tour/05-stacking-order.md",
  "tour/06-trade-offs.md",
]

[base]
template = "github:typika/templates/decorator-base/js"
focus = ["src/notifications/**"]

[variants]
typescript = "github:typika/templates/decorator/ts"

[[exercises]]
name = "add-sms-with-retry"
kind = "refactor"
title = "Send text messages with retry"
from = "base"
solutionFrom = "self"
failing = ["tests/sms-notifier.test.js"]

[[exercises]]
name = "stacking-order"
kind = "fix"
title = "Log each notification once"
failing = ["tests/email-notifier.test.js"]
hints = ["hint-1.md", "hint-2.md"]
