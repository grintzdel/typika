schema = 1
name = "composition-over-inheritance-ts"
title = "Composition vs inheritance: a product catalogue"
summary = "Build objects from small, swappable parts instead of a tree of subclasses."
license = "MIT-0"
authors = ["github:maoudin"]

[facets]
language = "typescript"
paradigm = ["oop"]
topic = ["fundamental/composition-over-inheritance"]
level = "beginner"
useCase = ["backend"]

[runtime]
kind = "browser-js"
entry = "src/main.ts"

[commands]
test = "vitest"

[tests]
include = ["tests/**/*.test.ts"]

[tour]
steps = [
  "tour/01-overview.md",
  "tour/02-hierarchy.md",
  "tour/03-explosion.md",
  "tour/04-compose.md",
  "tour/05-delegate.md",
  "tour/06-trade-offs.md",
]

[base]
template = "github:typika/templates/composition-over-inheritance-base/ts"
focus = ["src/catalog/**"]

[variants]
javascript = "github:typika/templates/composition-over-inheritance/js"

[[exercises]]
name = "add-gift-wrap"
kind = "refactor"
title = "Add gift wrap"
from = "base"
solutionFrom = "self"
failing = ["tests/gift-wrap.test.ts"]
