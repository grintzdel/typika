schema = 1
name = "composition-over-inheritance-kotlin"
title = "Composition vs inheritance: a product catalogue"
summary = "Build objects from small, swappable parts instead of a chain of open subclasses."
keywords = ["open", "final", "delegation", "by"]
license = "MIT-0"
authors = ["github:maoudin"]

[facets]
language = "kotlin"
paradigm = ["oop"]
topic = ["fundamental/composition-over-inheritance"]
level = "beginner"
useCase = ["backend"]

[runtime]
kind = "kotlin"
entry = "src/main/kotlin/Main.kt"

[commands]
test = "kotlin.test"

[tests]
include = ["src/test/kotlin/**/*.kt"]

[tour]
steps = [
  "tour/01-overview.md",
  "tour/02-hierarchy.md",
  "tour/03-explosion.md",
  "tour/04-compose.md",
  "tour/05-delegate.md",
  "tour/06-trade-offs.md",
]

[base]
template = "github:typika/templates/composition-over-inheritance-base/kotlin"
focus = ["src/main/kotlin/catalog/**"]

[variants]
typescript = "github:typika/templates/composition-over-inheritance/ts"

[[exercises]]
name = "add-gift-wrap"
