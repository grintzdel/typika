schema = 1
name = "open-closed-kotlin"
title = "Open/closed: discount rules"
summary = "Add a new discount by adding a rule, without editing the code that computes prices."
keywords = ["when", "lambda", "plugin"]
license = "MIT-0"
authors = ["github:maoudin"]

[facets]
language = "kotlin"
paradigm = ["oop", "functional"]
topic = ["principle/open-closed"]
level = "intermediate"
useCase = ["backend"]

[runtime]
kind = "kotlin"
entry = "src/main/kotlin/Main.kt"

[commands]
test = "kotlin.test"

[tests]
include = ["src/test/kotlin/**/*.kt"]

[tour]
steps = [
  "tour/01-overview.md",
  "tour/02-closed-switch.md",
  "tour/03-extension-point.md",
  "tour/04-rules.md",
  "tour/05-trade-offs.md",
]

[base]
template = "github:typika/templates/open-closed-base/kotlin"
focus = ["src/main/kotlin/pricing/**", "src/main/kotlin/receipts/**"]

[variants]
typescript = "github:typika/templates/open-closed/ts"

[[exercises]]
name = "add-black-friday-rule"
kind = "refactor"
title = "Add a Black Friday discount"
from = "base"
solutionFrom = "self"
failing = ["src/test/kotlin/pricing/BlackFridayTest.kt"]
