schema = 1
name = "interface-segregation-ts"
title = "Interface segregation: payment methods"
summary = "Give each client an interface with only the methods it calls, so no implementation has to fake the rest."
license = "MIT-0"
authors = ["github:maoudin"]

[facets]
language = "typescript"
paradigm = ["oop"]
topic = ["principle/interface-segregation"]
level = "intermediate"
useCase = ["backend"]

[runtime]
kind = "browser-js"
entry = "src/main.ts"

[commands]
test = "vitest"

[tests]
include = ["tests/**/*.test.ts"]

[tour]
steps = [
  "tour/01-overview.md",
  "tour/02-fat-interface.md",
  "tour/03-split-by-client.md",
  "tour/04-compose.md",
  "tour/05-trade-offs.md",
]

[base]
template = "github:typika/templates/interface-segregation-base/ts"
focus = ["src/payments/**", "src/open-shop.ts"]

[[exercises]]
name = "add-gift-card-payment"
kind = "refactor"
title = "Add gift card payments"
from = "base"
solutionFrom = "self"
failing = ["tests/gift-card-payment.test.ts"]
