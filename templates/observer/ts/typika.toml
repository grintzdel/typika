schema = 1
name = "observer-ts"
title = "Observer: reacting to an order"
summary = "Announce that something happened and let any number of subscribers react, without knowing them."
license = "MIT-0"
authors = ["github:maoudin"]

[facets]
language = "typescript"
paradigm = ["oop"]
topic = ["design-pattern/behavioral/observer"]
level = "intermediate"
useCase = ["backend"]

[runtime]
kind = "browser-js"
entry = "src/main.ts"

[commands]
test = "vitest"

[tests]
include = ["tests/**/*.test.ts"]

[tour]
steps = [
  "tour/01-overview.md",
  "tour/02-direct-calls.md",
  "tour/03-subject.md",
  "tour/04-subscribers.md",
  "tour/05-failure-isolation.md",
  "tour/06-trade-offs.md",
]

[base]
template = "github:typika/templates/observer-base/ts"
focus = ["src/orders/**", "src/open-shop.ts"]

[variants]
javascript = "github:typika/templates/observer/js"
kotlin = "github:typika/templates/observer/kotlin"

[[exercises]]
name = "add-loyalty-points"
kind = "refactor"
title = "Add loyalty points"
from = "base"
solutionFrom = "self"
failing = ["tests/loyalty-points.test.ts"]

[[exercises]]
name = "isolate-failing-subscriber"
kind = "fix"
title = "Isolate a failing subscriber"
failing = ["tests/order-events.test.ts"]
hints = ["hint-1.md", "hint-2.md"]
