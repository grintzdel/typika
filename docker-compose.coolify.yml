services:
  web:
    build: .
    restart: unless-stopped
    environment:
      TYPIKA_PUBLIC_URL: ${TYPIKA_PUBLIC_URL:?set TYPIKA_PUBLIC_URL}
      TYPIKA_RUNTIME_ORIGIN: ${TYPIKA_RUNTIME_ORIGIN:?set TYPIKA_RUNTIME_ORIGIN}
      TYPIKA_TRUST_PROXY: 'true'
      KOTLIN_COMPILER_URL: http://kotlin-compiler:8080
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    expose: ['3000']
    networks: [default, kotlin]
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  kotlin-compiler:
    build: services/kotlin-compiler
    restart: unless-stopped
    environment:
      KOTLIN_COMPILER_CONCURRENCY: ${KOTLIN_COMPILER_CONCURRENCY:-2}
      KOTLIN_COMPILER_QUEUE_MAX: ${KOTLIN_COMPILER_QUEUE_MAX:-20}
      KOTLIN_COMPILER_TIMEOUT_MS: ${KOTLIN_COMPILER_TIMEOUT_MS:-15000}
      KOTLIN_COMPILER_CACHE_MB: ${KOTLIN_COMPILER_CACHE_MB:-32}
    expose: ['8080']
    networks: [kotlin]
    read_only: true
    tmpfs: ['/tmp:size=64m,mode=1777']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: ${KOTLIN_COMPILER_MEMORY:-1g}
    memswap_limit: ${KOTLIN_COMPILER_MEMORY:-1g}
    cpus: ${KOTLIN_COMPILER_CPUS:-2}
    pids_limit: 256

networks:
  default: {}
  kotlin:
    internal: true
